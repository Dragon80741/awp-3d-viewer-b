server {
    listen 80;
    server_name localhost;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # AMIRAL NWX Tiles (mounted from NAS to /data)
    location /amiral/ {
        alias /data/AMIRAL_NWX_TILES/;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Expose-Headers 'Content-Length, ETag' always;
        add_header Access-Control-Allow-Headers * always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # MIME types for 3D tiles
        types {
            application/json json;
            model/gltf-binary glb;
            application/octet-stream bin;
            text/plain txt;
        }
    }

    # GS PHU Area NWX Tiles (E3D only - Equipment & Piping)
    location /phu/ {
        alias /data/PHU_Area_E3D_TILES/;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Expose-Headers 'Content-Length, ETag' always;
        add_header Access-Control-Allow-Headers * always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # MIME types for 3D tiles
        types {
            application/json json;
            model/gltf-binary glb;
            application/octet-stream bin;
            text/plain txt;
        }
    }

    # GS PHU Area ALL NWX Tiles (Tekla structure included)
    location /phu_all/ {
        alias /data/PHU_Area_ALL_TILES/;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Expose-Headers 'Content-Length, ETag' always;
        add_header Access-Control-Allow-Headers * always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # MIME types for 3D tiles
        types {
            application/json json;
            model/gltf-binary glb;
            application/octet-stream bin;
            text/plain txt;
        }
    }
}
